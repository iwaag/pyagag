[project]
name = "pyagag"
version = "0.1.0"
description = "Shared agent configuration and harness process seam"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
agentchat = "agag.chat:main"
agag = "agag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agag"]
